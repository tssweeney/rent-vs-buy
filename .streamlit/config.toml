# Financial dashboard theme — follows the system light/dark preference.
# Shared typography/shape in [theme]; per-mode palettes in [theme.light]/[theme.dark].

[theme]
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "6px"
buttonRadius = "6px"

font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 14
baseFontWeight = 400
codeFontSize = "13px"
headingFontSizes = ["28px", "22px", "18px", "16px", "14px", "12px"]
headingFontWeights = [700, 600, 600, 600, 500, 500]
linkUnderline = false

[theme.light]
primaryColor = "#2563EB"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F5F9"
codeBackgroundColor = "#F1F5F9"
textColor = "#0F172A"
linkColor = "#2563EB"
borderColor = "#CBD5E1"
codeTextColor = "#334155"
greenColor = "#059669"
redColor = "#DC2626"
yellowColor = "#D97706"
orangeColor = "#EA580C"
blueColor = "#2563EB"
violetColor = "#7C3AED"
grayColor = "#64748B"
chartCategoricalColors = [
    "#2563EB",
    "#059669",
    "#7C3AED",
    "#DC2626",
    "#D97706",
    "#0284C7",
    "#64748B",
    "#EA580C",
]
dataframeBorderColor = "#CBD5E1"
dataframeHeaderBackgroundColor = "#F1F5F9"

[theme.light.sidebar]
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#E2E8F0"
codeBackgroundColor = "#E2E8F0"
textColor = "#0F172A"
borderColor = "#CBD5E1"
primaryColor = "#2563EB"

[theme.dark]
primaryColor = "#60A5FA"
backgroundColor = "#0F172A"
secondaryBackgroundColor = "#1E293B"
codeBackgroundColor = "#1E293B"
textColor = "#F1F5F9"
linkColor = "#60A5FA"
borderColor = "#334155"
codeTextColor = "#CBD5E1"
greenColor = "#34D399"
redColor = "#F87171"
yellowColor = "#FBBF24"
orangeColor = "#FB923C"
blueColor = "#60A5FA"
violetColor = "#A78BFA"
grayColor = "#94A3B8"
chartCategoricalColors = [
    "#60A5FA",
    "#34D399",
    "#A78BFA",
    "#F87171",
    "#FBBF24",
    "#38BDF8",
    "#94A3B8",
    "#FB923C",
]
dataframeBorderColor = "#334155"
dataframeHeaderBackgroundColor = "#1E293B"

[theme.dark.sidebar]
backgroundColor = "#0F172A"
secondaryBackgroundColor = "#1E293B"
codeBackgroundColor = "#1E293B"
textColor = "#F1F5F9"
borderColor = "#334155"
primaryColor = "#60A5FA"
