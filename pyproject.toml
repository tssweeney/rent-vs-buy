[project]
name = "mortgages"
version = "0.1.0"
description = "Rent vs. buy tradeoff analysis dashboard"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.37",
    "plotly>=5.20",
    "pandas>=2.0",
    "numpy>=1.26",
    "pyarrow!=25.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
